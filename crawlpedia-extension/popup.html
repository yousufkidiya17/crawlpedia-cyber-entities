<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 290px;
    background: #090d13;
    color: #e6edf3;
    font-family: ui-monospace, SFMono-Regular, "Courier New", monospace;
    font-size: 11px;
    padding: 14px;
    border: 1px solid #1f2937;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #1f2937;
    padding-bottom: 8px;
    margin-bottom: 12px;
  }
  .title {
    color: #00f0ff;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1.5px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .ver {
    background: rgba(0, 255, 102, 0.15);
    border: 1px solid #00ff66;
    color: #00ff66;
    font-size: 9px;
    padding: 1px 4px;
    border-radius: 3px;
  }
  .desc {
    color: #8b949e;
    font-size: 11px;
    line-height: 1.4;
    margin-bottom: 12px;
  }
  .btn-primary {
    display: block;
    width: 100%;
    padding: 10px;
    background: #ff003c;
    border: 1px solid #ff3366;
    color: #ffffff;
    border-radius: 6px;
    font-weight: bold;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 1px;
    cursor: pointer;
    text-align: center;
